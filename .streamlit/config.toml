[server]
# Let the hosting platform select the bind address; run.ps1 sets localhost locally.
headless = true
maxUploadSize = 10

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#287BC2"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F0EC"
textColor = "#111318"
font = "sans serif"
